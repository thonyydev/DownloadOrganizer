name: Release

# Builds the installer for a version tag and leaves it in a draft release.
# Publishing stays a manual step, after testing the installer from the draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Later steps run third-party code.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          grep -q "^version = \"$version\"$" src-tauri/Cargo.toml || { echo "src-tauri/Cargo.toml is not at $version"; exit 1; }

      - name: Run tests
        run: |
          npm run test:ui
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Keep installer for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  draft:
    name: Sign and create draft
    needs: build
    # A clean machine with no checkout, so no dependency's code can touch the key that every install trusts.
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Get installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: installer

      - name: Sign installer for updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes @tauri-apps/cli@2.12.1 signer sign installer/*-setup.exe

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installer
          installer="$(ls *-setup.exe)"
          # GitHub replaces spaces in asset names with dots; the hash file must name the asset.
          printf '%s  %s\n' "$(sha256sum "$installer" | cut -d' ' -f1)" "${installer// /.}" > "$installer.sha256"
          # Installed apps read this from the latest published release, so a draft never reaches them.
          printf '{"version":"%s","pub_date":"%s","platforms":{"windows-x86_64":{"signature":"%s","url":"%s"}}}\n' \
            "${GITHUB_REF_NAME#v}" "$(date -u +%FT%TZ)" "$(cat "$installer.sig")" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${installer// /.}" > latest.json
          gh release create "$GITHUB_REF_NAME" "$installer" "$installer.sha256" latest.json \
            --repo "$GITHUB_REPOSITORY" --draft --title "Download Organizer $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
